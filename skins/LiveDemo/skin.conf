###############################################################################
# LiveDemo skin - demonstrates the $live tag from the livetag extension.     #
# Units, formats and labels come from WeeWX defaults; override them in the    #
# [[LiveDemo]] section of weewx.conf exactly as for any other skin.          #
###############################################################################

[CheetahGenerator]
    encoding = utf8
    search_list_extensions = user.livetag.LiveTags

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator
